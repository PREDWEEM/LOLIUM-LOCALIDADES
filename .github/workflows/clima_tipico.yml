name: Clima típico de los sitios calibrados

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - localidades.json
      - clima_tipico.py
      - clima_openmeteo.py
      - .github/workflows/clima_tipico.yml

permissions:
  contents: write

concurrency:
  group: clima-localidades
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install pandas numpy requests

      - name: Calcular el clima típico (enero a abril, 2011–2025)
        run: python clima_tipico.py

      - name: Guardar los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clima/tipico_sitios.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Clima típico de los sitios calibrados"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
