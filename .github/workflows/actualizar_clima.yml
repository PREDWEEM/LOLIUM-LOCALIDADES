name: Actualizar el clima de las localidades

on:
  schedule:
    # 07:40 y 15:40 de Argentina (UTC-3), después de la actualización de ECMWF
    - cron: '40 10 * * *'
    - cron: '40 18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - localidades.json
      - actualizar_clima.py
      - clima_openmeteo.py
      - .github/workflows/actualizar_clima.yml

permissions:
  contents: write

concurrency:
  group: clima-localidades
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install pandas numpy requests

      - name: Bajar el clima de cada localidad (Open-Meteo)
        run: python actualizar_clima.py

      - name: Guardar los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clima
          if git diff --cached --quiet; then
            echo "Sin cambios en el clima."
            exit 0
          fi
          git commit -m "Clima de las localidades: $(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep 5
          done
          exit 1
